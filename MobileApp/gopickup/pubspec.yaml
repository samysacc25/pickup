name: gopickup
description: App de clientes y conductores para Go Pickup en Tungurahua.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  google_maps_flutter: ^2.18.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  signalr_netcore: ^1.3.5
  intl: ^0.19.0
  image_picker: ^1.1.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/iconopickUp.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/iconopickUp.png"
